name: Hanwha Game Bot Schedule

on:
  schedule:
    # 화요일~일요일, 한국 시간(KST) 14:00 ~ 23:00 (UTC 05:00 ~ 14:00)
    # GitHub Actions의 최소 주기는 5분입니다. (1분 단위는 지원하지 않음)
    - cron: '*/5 5-14 * * 0,2-6'
  workflow_dispatch: # 수동 실행 기능

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Cache (State Files)
        uses: actions/cache/restore@v4
        with:
          path: ./*.txt
          key: game-state-${{ github.run_id }}
          restore-keys: |
            game-state-

      - name: Run Hanwha Game Bot
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python hanwha_game_bot.py --notify slack

      - name: Save Cache (State Files)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ./*.txt
          key: game-state-${{ github.run_id }}
